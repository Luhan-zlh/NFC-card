<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>给凯玟的卡片</title>
<link rel="stylesheet" href="css/style.css">

<!-- PWA：支持"添加到主屏幕" -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我们的卡片">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>

<canvas id="starfield"></canvas>

<!-- 进入遮罩：碰一下卡片打开网页后，先看到这个（开信封仪式） -->
<div id="enter-overlay">
  <div class="pre-greeting" id="pre-greeting"></div>

  <div class="envelope-wrap" id="envelope-wrap">
    <div class="envelope">
      <div class="envelope-back"></div>
      <div class="letter" id="envelope-letter">
        <div class="letter-content">♥</div>
      </div>
      <div class="envelope-flap" id="envelope-flap"></div>
    </div>
    <!-- 蜡封故意完全挪出 .envelope 这个 3D 变换容器（preserve-3d + clip-path 组合
         之前造成了堆叠/裁剪的不确定行为），改成纯 2D 定位的独立元素，
         直接挂在 .envelope-wrap 下面，彻底避开这个问题 -->
    <div class="envelope-seal" id="envelope-seal">
      <!-- 进度环适度比蜡封本体大一圈，这样手指压在中间时，外圈依然能露出来看到进度 -->
      <svg class="seal-progress-ring" viewBox="0 0 74 74">
        <circle class="seal-ring-bg" cx="37" cy="37" r="34"></circle>
        <circle class="seal-ring-fg" id="seal-ring-fg" cx="37" cy="37" r="34"></circle>
      </svg>
      <span class="seal-heart">♥</span>
    </div>
  </div>

  <div class="overlay-hint" id="overlay-hint">按住封蜡，揭晓这张卡片</div>
</div>

<main>

  <!-- 开场 -->
  <section class="hero">
    <div class="subtitle">TO</div>
    <div class="her-name serif" id="her-name">凯玟</div>
    <div class="greeting" id="greeting-text">这是只属于你的卡片</div>
  </section>

  <div class="divider"></div>

  <!-- 在一起天数计数器 -->
  <section class="counter-section">
    <div class="counter-label">我们已经在一起</div>
    <div id="counter-value"></div>
  </section>

  <!-- 里程碑：即将到来的倒计时（可以有好几个）+ 已经达成的记录 -->
  <!-- 完全没有任何配置里程碑时，这个板块会自动隐藏 -->
  <section class="milestone-section" id="milestone-section">
    <div class="section-title serif">我们的里程碑</div>
    <div class="milestone-upcoming" id="milestone-upcoming"></div>
    <div class="milestone-achieved-wrap" id="milestone-achieved-wrap">
      <div class="milestone-achieved-label">已经一起走过</div>
      <div class="milestone-achieved-list" id="milestone-achieved"></div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- 时间线 / 回忆录 -->
  <section class="timeline-section">
    <div class="section-title serif">我们的故事</div>
    <div class="section-subtitle">— 一些值得记住的日子 —</div>
    <ul id="timeline-list"></ul>
  </section>

  <div class="divider"></div>

  <!-- 爱意小纸条 -->
  <section class="note-section">
    <div class="section-title serif">今天想对你说</div>
    <div class="note-card">
      <div id="love-note-text"></div>
      <button id="shuffle-note-btn">换一条 ↻</button>
    </div>
  </section>

  <div class="divider"></div>

  <!-- 共享留言本 -->
  <section class="notebook-section">
    <div class="section-title serif">我们的留言本</div>
    <div class="section-subtitle">— 想到什么都可以随时写进去，两个人都可以 —</div>
    <a id="notebook-btn" href="javascript:void(0)" target="_blank" rel="noopener">留言本即将上线 …</a>
  </section>

  <div class="divider"></div>

  <!-- 同步状态：在线/位置/打卡/报备 -->
  <!-- sync 配置未填写时整个板块自动隐藏 -->
  <section class="sync-section" id="sync-section" style="display:none">
    <div class="section-title serif">我们在一起</div>
    <div class="section-subtitle">— 知道彼此的状态 —</div>

    <!-- 对方状态卡片 -->
    <div class="sync-partner-card" id="sync-partner-card">
      <div class="sync-partner-header">
        <span class="sync-partner-name" id="sync-partner-name"></span>
        <span class="sync-online-dot" id="sync-online-dot"></span>
        <span class="sync-online-text" id="sync-online-text">读取中…</span>
      </div>
      <div class="sync-partner-location" id="sync-partner-location"></div>
      <div class="sync-partner-checkin" id="sync-partner-checkin"></div>
      <div class="sync-partner-reports" id="sync-partner-reports"></div>
    </div>

    <!-- 我的打卡 -->
    <div class="sync-checkin-card">
      <div class="sync-checkin-label">今日打卡</div>
      <button id="sync-checkin-btn" class="action-btn">打卡</button>
      <div class="sync-checkin-stats" id="sync-checkin-stats"></div>
    </div>

    <!-- 报备 -->
    <div class="sync-report-card">
      <div class="sync-report-label">报备</div>
      <div class="sync-report-buttons">
        <button class="sync-report-btn" data-report="wakeup">起床了</button>
        <button class="sync-report-btn" data-report="sleep">睡觉了</button>
        <button class="sync-report-btn" data-report="miss">想你了</button>
      </div>
      <div class="sync-my-reports" id="sync-my-reports"></div>
    </div>

    <div class="sync-locate-wrap">
      <button id="sync-locate-btn" class="action-btn">分享我的位置</button>
    </div>
  </section>

  <div class="divider"></div>

  <!-- 我们的足迹 / 距离 -->
  <!-- 完全没有配置 places 时这个板块会自动隐藏 -->
  <section class="places-section" id="places-section">
    <div class="section-title serif">我们的足迹</div>
    <div class="section-subtitle">— 那些有意义的地方 —</div>
    <div class="places-list" id="places-list"></div>
    <button id="locate-btn" class="action-btn">查看我们之间的距离</button>
    <div class="places-distance" id="places-distance"></div>
    <div class="visited-cities-wrap" id="visited-cities-wrap" style="display:none">
      <div class="visited-cities-label">这张卡片到过这些城市</div>
      <div class="visited-cities-list" id="visited-cities-list"></div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- 想你了按钮 -->
  <!-- missYouReply 留空时按钮会自动隐藏 -->
  <section class="miss-you-section" id="miss-you-section">
    <button id="miss-you-btn" class="miss-you-btn">想你了</button>
  </section>

  <footer>made with ♥ · 2026</footer>

</main>

<script src="js/data.js" defer></script>
<script src="js/script.js" defer></script>
<script src="js/sync.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
